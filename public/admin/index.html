<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saltline · 管理后台</title><link rel="stylesheet" href="/admin/admin.css"><script type="module" src="/admin/admin.js"></script></head><body>
<section id="login-screen" class="login-screen"><div class="login-brand"><div class="harbor-symbol" aria-hidden="true">S</div><h1>Saltline</h1><p>管理后台</p><span>掌握港口里的每一次变化。</span></div><form id="login-form" class="login-form"><h2>管理员登录</h2><p>使用服务器初始化的管理员密码。</p><label for="login-password">密码</label><input id="login-password" type="password" autocomplete="current-password" required maxlength="200"><button class="primary" id="login-submit">登录后台</button><p id="login-status" role="status">正在检查后台状态…</p><a href="/">返回游戏</a></form></section>
<div id="console" hidden><aside><a href="/admin" class="brand"><span aria-hidden="true" class="brand-mark">S</span><span>Saltline<small>管理后台</small></span></a><nav aria-label="后台导航"><button data-page="overview" aria-current="page">运行概览</button><button data-page="providers">AI 接口</button><button data-page="features">角色设置</button><button data-page="records">生成记录</button><button data-page="system">系统设置</button></nav><div class="sidebar-footer"><a href="/" target="_blank" rel="noopener">打开游戏 ↗</a><button id="logout">退出登录</button><small>Saltline control / v0.2</small></div></aside><div class="workspace"><header class="topbar"><span id="breadcrumb">运行概览</span><span class="online-state"><i></i>管理会话已连接</span></header><main id="content" tabindex="-1"></main><footer class="workspace-footer"><span>Saltline 港口控制台</span><span id="config-version"></span></footer></div></div>

</body></html>
